<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria - Formas de Acrílico Premium</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --gold: #D4AF37;
      --gold-dark: #B8960F;
      --gold-light: #FFF8E7;
      --navy: #0f172a;
      --text: #334155;
      --bg: #f4f6fa;
      --white: #ffffff;
      --border: #e2e8f0;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: 70px;
    }

    /* ===== HEADER COM MENU HAMBURGUER ===== */
    .top-header {
      position: fixed; top: 0; left: 0; width: 100%;
      background: var(--white);
      box-shadow: 0 4px 12px rgba(0,0,0,.10);
      z-index: 1050;
      height: 70px;
    }
    .nav-container {
      max-width: 1200px; margin: 0 auto;
      padding: 0 24px; height: 70px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; }
    .logo-img {
      width: 100px; height: 100px; border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #fff;
      font-weight: 800;
      flex-shrink: 0;
      overflow: hidden;
    }
    .logo-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .logo-text { font-size: 1.05rem; font-weight: 800; color: var(--navy); line-height: 1.2; }
    .logo-sub  { font-size: .7rem; color: var(--gold); letter-spacing: .05em; font-weight: 600; }

    /* ===== MENU HAMBURGUER ===== */
    .menu-toggle {
      display: none;
      background: none;
      border: 2px solid var(--gold);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--gold);
      font-size: 1.3rem;
      transition: all 0.2s ease;
    }
    .menu-toggle:hover {
      background: var(--gold);
      color: #fff;
    }

    .nav-menu {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .nav-link-custom {
      color: var(--navy);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 8px 12px;
      border-radius: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
      background: none;
      border: none;
    }
    .nav-link-custom:hover {
      background: var(--gold-light);
      color: var(--gold-dark);
    }
    .nav-link-custom.active {
      color: var(--gold);
      border-bottom: 2px solid var(--gold);
    }

    /* Menu mobile (offcanvas lateral) */
    .mobile-menu {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: var(--white);
      box-shadow: 2px 0 20px rgba(0,0,0,0.1);
      z-index: 1060;
      transition: left 0.3s ease;
      padding: 80px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .mobile-menu.open {
      left: 0;
    }
    .mobile-menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1055;
      display: none;
    }
    .mobile-menu-overlay.open {
      display: block;
    }
    .mobile-menu .nav-link-custom {
      display: block;
      padding: 12px 16px;
      font-size: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .mobile-menu .nav-link-custom:last-child {
      border-bottom: none;
    }
    .close-menu {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--navy);
    }

    .btn-cart {
      position: relative; background: none; border: 2px solid var(--gold);
      border-radius: 50px; padding: 7px 18px; cursor: pointer;
      color: var(--gold); font-size: .95rem; font-weight: 700;
      display: flex; align-items: center; gap: .4rem; transition: .2s;
      text-decoration: none;
    }
    .btn-cart:hover { background: var(--gold); color: #fff; }
    .btn-cart i { font-size: 1.1rem; }

    /* ===== SEÇÃO PRINCIPAL ===== */
    .section { max-width: 1200px; margin: 0 auto; padding: 4rem 1.5rem; }
    .section-title { text-align: center; margin-bottom: 3rem; }
    .section-title h2 { font-size: 2rem; font-weight: 800; color: var(--navy); }
    .section-title p  { color: #64748b; margin-top: .5rem; font-size: 1rem; }
    .title-bar { width: 60px; height: 4px; background: var(--gold); margin: .8rem auto 0; border-radius: 2px; }

    /* ===== ESTILOS DA GALERIA ===== */
    .gallery-section {
      background: var(--white);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .gallery-filters {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .filter-btn {
      background: none;
      border: 2px solid var(--border);
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover,
    .filter-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #fff;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .gallery-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background: var(--bg);
    }
    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .gallery-img-wrap {
      width: 100%;
      height: 250px;
      overflow: hidden;
      background: linear-gradient(135deg, #e8f4fb, #d0eaf7);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gallery-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .gallery-item:hover .gallery-img-wrap img {
      transform: scale(1.05);
    }
    .gallery-info {
      padding: 1rem;
      background: var(--white);
    }
    .gallery-title {
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.3rem;
      font-size: 0.95rem;
    }
    .gallery-category {
      font-size: 0.75rem;
      color: var(--gold);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Modal da Galeria */
    .gallery-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1100;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
    .gallery-modal.active {
      display: flex;
    }
    .gallery-modal-content {
      max-width: 90%;
      max-height: 90%;
      position: relative;
    }
    .gallery-modal-content img {
      width: auto;
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      display: block;
      margin: auto;
    }
    .close-modal {
      position: absolute;
      top: -40px;
      right: 0;
      color: #fff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .close-modal:hover {
      color: var(--gold);
    }
    .modal-caption {
      text-align: center;
      color: #fff;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    /* Botão Voltar */
    .back-home-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 20px;
      color: var(--text);
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
      margin-bottom: 1.5rem;
      text-decoration: none;
    }
    .back-home-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* TOAST */
    .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 3000; display: flex; flex-direction: column; gap: .5rem; }
    .toast-msg {
      background: var(--navy); color: #fff; border-radius: 12px;
      padding: .85rem 1.2rem; font-size: .88rem;
      display: flex; align-items: center; gap: .5rem;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      animation: slideIn .3s ease; min-width: 220px;
    }
    .toast-msg.success { background: var(--green); }
    .toast-msg.error   { background: var(--red); }
    @keyframes slideIn { from{transform:translateX(120px);opacity:0} to{transform:translateX(0);opacity:1} }

    /* Footer */
    .site-footer {
      text-align: center; padding: 2rem 1rem;
      background: var(--navy); color: #64748b; font-size: .85rem; margin-top: 3rem;
    }
    .site-footer span { color: var(--gold); }
    .site-footer a {
      color: #64748b;
      text-decoration: none;
    }
    .site-footer a:hover {
      color: var(--gold);
    }

    @media(max-width: 768px) {
      .nav-menu {
        display: none;
      }
      .menu-toggle {
        display: block;
      }
      .gallery-filters { gap: 0.5rem; }
      .filter-btn { padding: 6px 14px; font-size: 0.8rem; }
      .cart-text { display: none; }
      .btn-cart { padding: 7px 12px; }
    }
  </style>
</head>
<body>

<!-- ===== HEADER COM MENU HAMBURGUER ===== -->
<header class="top-header">
  <div class="nav-container">
    <a href="index.html" class="logo">
      <div class="logo-img">
        <img src="imagens/img_menu.png" alt="Logo Formas de Acrílico Premium">
      </div>
      <div>
        <div class="logo-text"></div>
        <div class="logo-sub"></div>
      </div>
    </a>
    
    <!-- Menu Desktop -->
    <div class="nav-menu">
      <button class="nav-link-custom" onclick="window.location.href='index.html'">Início</button>
      <button class="nav-link-custom active" onclick="window.location.href='galeria.html'">Galeria</button>
      <button class="nav-link-custom" onclick="window.location.href='aboutus.html'">Sobre Nós</button>
    </div>

    <!-- Botão Menu Hamburguer (mobile) -->
    <button class="menu-toggle" onclick="toggleMobileMenu()">
      <i class="bi bi-list"></i>
    </button>

   
  </div>
</header>

<!-- Menu Mobile (Offcanvas lateral) -->
<div class="mobile-menu-overlay" id="mobileMenuOverlay" onclick="closeMobileMenu()"></div>
<div class="mobile-menu" id="mobileMenu">
  <button class="close-menu" onclick="closeMobileMenu()">
    <i class="bi bi-x-lg"></i>
  </button>

  <button class="nav-link-custom" onclick="window.location.href='index.html'">
    <i class="bi bi-house"></i> Início
  </button>
  <button class="nav-link-custom active" onclick="window.location.href='galeria.html'">
    <i class="bi bi-images"></i> Galeria
  </button>
  <button class="nav-link-custom" onclick="window.location.href='aboutus.html'">
    <i class="bi bi-building"></i> Sobre Nós
  </button>
</div>

<!-- ===== TOAST CONTAINER ===== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ===== CONTEÚDO PRINCIPAL ===== -->
<main>
  <div class="section">
    <div class="section-title">
      <h2><i class="bi bi-images" style="color: var(--gold);"></i> Nossa Galeria</h2>
      <p>Conheça nosso trabalho e inspire-se com criações exclusivas em acrílico</p>
      <div class="title-bar"></div>
    </div>

    <div class="gallery-section">
      <div class="gallery-filters">
        <button class="filter-btn active" onclick="filterGallery('all')">Todos</button>
        <button class="filter-btn" onclick="filterGallery('formas')">Formas</button>
        <button class="filter-btn" onclick="filterGallery('pecas')">Peças Prontas</button>
        <button class="filter-btn" onclick="filterGallery('detalhes')">Detalhes</button>
      </div>

      <div class="gallery-grid" id="galleryGrid">
        <!-- As imagens serão carregadas dinamicamente via JavaScript -->
      </div>
    </div>

    <div style="text-align: center; margin-top: 2rem;">
      <a href="index.html" class="back-home-btn">
        <i class="bi bi-arrow-left"></i> Voltar para a Loja
      </a>
    </div>
  </div>
</main>

<!-- Modal para visualização da galeria -->
<div id="galleryModal" class="gallery-modal" onclick="closeGalleryModal()">
  <div class="gallery-modal-content" onclick="event.stopPropagation()">
    <span class="close-modal" onclick="closeGalleryModal()">&times;</span>
    <img id="modalImage" src="" alt="">
    <div id="modalCaption" class="modal-caption"></div>
  </div>
</div>

<footer class="site-footer">
  <p><span>✦ SB Acrilicos</span> &copy; 2025 — Qualidade que você pode tocar.</p>
  <p><span><a href="https://www.gr2sites.com.br" target="_blank">Site criado por GR2 sites e sistemas</a></span></p>
</footer>

<script>
// ============================================================
//  MENU MOBILE
// ============================================================
function toggleMobileMenu() {
  const menu = document.getElementById('mobileMenu');
  const overlay = document.getElementById('mobileMenuOverlay');
  menu.classList.toggle('open');
  overlay.classList.toggle('open');
  document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
}

function closeMobileMenu() {
  const menu = document.getElementById('mobileMenu');
  const overlay = document.getElementById('mobileMenuOverlay');
  menu.classList.remove('open');
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

// ============================================================
//  TOAST
// ============================================================
function toast(msg, type = '') {
  const c = document.getElementById('toastContainer');
  if (!c) return;
  const el = document.createElement('div');
  el.className = 'toast-msg' + (type ? ' ' + type : '');
  const icon = type === 'success' ? 'check-circle-fill' : type === 'error' ? 'x-circle-fill' : 'info-circle-fill';
  el.innerHTML = `<i class="bi bi-${icon}"></i> ${msg}`;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); }, 2800);
}

// ============================================================
//  DADOS DA GALERIA
// ============================================================
const galleryItems = [
  // Formas (produtos)
  {
    id: 1,
    title: "Forma Acrílica 30x10x10",
    category: "formas",
    image: "imagens/produto-01.jpeg",
    description: "Forma cristal de alta transparência para produções de menor volume"
  },
  {
    id: 2,
    title: "Forma Acrílica 30x20x10",
    category: "formas",
    image: "imagens/produto-02.jpeg",
    description: "Formato intermediário perfeito para produções variadas"
  },
  {
    id: 3,
    title: "Forma Acrílica 30x30x10",
    category: "formas",
    image: "imagens/produto-03.jpeg",
    description: "Formato grande para produções de alto volume"
  },
  // Peças Prontas - Exemplos de trabalhos realizados
  {
    id: 4,
    title: "Fita de cetin personalizada",
    category: "pecas",
    image: "imagens/galeria-01.jfif",
    description: "Peça exclusiva com acabamento premium e design moderno"
  },
  {
    id: 5,
    title: "Colher de madeira personalizada",
    category: "pecas",
    image: "imagens/galeria-02.jfif",
    description: "Suporte elegante para eventos e confeitaria"
  },
  {
    id: 6,
    title: "Placa de sinalização",
    category: "pecas",
    image: "imagens/galeria-03.jfif",
    description: "Organizador multifuncional com design sofisticado"
  },
  {
    id: 7,
    title: "Cake board",
    category: "pecas",
    image: "imagens/galeria-04.jfif",
    description: "Letreiro personalizado para decoração de ambientes"
  },
  {
    id: 8,
    title: "Palito acrilico personalizado",
    category: "pecas",
    image: "imagens/galeria-05.jfif",
    description: "Porta-retrato cristal com acabamento impecável"
  },
  // Detalhes e acabamentos
  {
    id: 9,
    title: "Topo de bolo personalizado espeladado dourado",
    category: "detalhes",
    image: "imagens/galeria-06.jfif",
    description: "Acabamento de alta transparência e brilho"
  },
  {
    id: 10,
    title: "Board formato personalizado",
    category: "detalhes",
    image: "imagens/galeria-07.jfif",
    description: "Corte a laser com precisão milimétrica"
  },
  {
    id: 11,
    title: "Cake Board",
    category: "detalhes",
    image: "imagens/galeria-08.jfif",
    description: "Polimento que garante acabamento perfeito"
  },
  {
    id: 12,
    title: "Fita de Cetin personalizada",
    category: "detalhes",
    image: "imagens/galeria-09.jfif",
    description: "Capacidade para produções em larga escala"
  }
];

// ============================================================
//  FUNÇÕES DA GALERIA
// ============================================================
let currentFilter = 'all';

function renderGallery() {
  const grid = document.getElementById('galleryGrid');
  if (!grid) return;
  
  const filteredItems = currentFilter === 'all' 
    ? galleryItems 
    : galleryItems.filter(item => item.category === currentFilter);
  
  if (filteredItems.length === 0) {
    grid.innerHTML = `
      <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
        <i class="bi bi-images" style="font-size: 3rem; color: var(--gold);"></i>
        <p style="margin-top: 1rem; color: #64748b;">Nenhuma imagem encontrada nesta categoria.</p>
      </div>
    `;
    return;
  }
  
  grid.innerHTML = filteredItems.map(item => `
    <div class="gallery-item" onclick="openGalleryModal('${item.image}', '${item.title}', '${item.description}')">
      <div class="gallery-img-wrap">
        <img src="${item.image}" alt="${item.title}" 
          onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\\'font-size:3rem;color:var(--gold);\\'><i class=\\'bi bi-image-fill\\'></i></div>'">
      </div>
      <div class="gallery-info">
        <div class="gallery-category">${getCategoryName(item.category)}</div>
        <div class="gallery-title">${item.title}</div>
      </div>
    </div>
  `).join('');
}

function getCategoryName(category) {
  const names = {
    'formas': '📦 Formas',
    'pecas': '✨ Peças Prontas',
    'detalhes': '🔍 Detalhes'
  };
  return names[category] || category;
}

function filterGallery(category) {
  currentFilter = category;
  
  // Atualizar botões ativos
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
  
  renderGallery();
}

function openGalleryModal(imageSrc, title, description) {
  const modal = document.getElementById('galleryModal');
  const modalImage = document.getElementById('modalImage');
  const modalCaption = document.getElementById('modalCaption');
  
  modalImage.src = imageSrc;
  modalImage.alt = title;
  modalCaption.innerHTML = `<strong>${title}</strong><br>${description}`;
  
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeGalleryModal() {
  const modal = document.getElementById('galleryModal');
  modal.classList.remove('active');
  document.body.style.overflow = '';
}

// Fechar modal com tecla ESC
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    closeGalleryModal();
  }
});

// ============================================================
//  INICIALIZAÇÃO
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  renderGallery();
  
  // Verificar se veio com parâmetro de filtro na URL
  const urlParams = new URLSearchParams(window.location.search);
  const filter = urlParams.get('categoria');
  if (filter && ['formas', 'pecas', 'detalhes'].includes(filter)) {
    currentFilter = filter;
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => {
      if (btn.textContent.toLowerCase().includes(filter)) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
    renderGallery();
  }
});
</script>
</body>
</html>
