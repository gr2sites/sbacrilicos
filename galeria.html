<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria - Formas de Acrílico Premium</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --gold: #D4AF37;
      --gold-dark: #B8960F;
      --gold-light: #FFF8E7;
      --navy: #0f172a;
      --text: #334155;
      --bg: #f4f6fa;
      --white: #ffffff;
      --border: #e2e8f0;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: 70px;
    }

    /* ===== HEADER COM MENU HAMBURGUER ===== */
    .top-header {
      position: fixed; top: 0; left: 0; width: 100%;
      background: var(--white);
      box-shadow: 0 4px 12px rgba(0,0,0,.10);
      z-index: 1050;
      height: 70px;
    }
    .nav-container {
      max-width: 1200px; margin: 0 auto;
      padding: 0 24px; height: 70px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; }
    .logo-img {
      width: 100px; height: 100px; border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #fff;
      font-weight: 800;
      flex-shrink: 0;
      overflow: hidden;
    }
    .logo-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .logo-text { font-size: 1.05rem; font-weight: 800; color: var(--navy); line-height: 1.2; }
    .logo-sub  { font-size: .7rem; color: var(--gold); letter-spacing: .05em; font-weight: 600; }

    /* ===== MENU HAMBURGUER ===== */
    .menu-toggle {
      display: none;
      background: none;
      border: 2px solid var(--gold);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--gold);
      font-size: 1.3rem;
      transition: all 0.2s ease;
    }
    .menu-toggle:hover {
      background: var(--gold);
      color: #fff;
    }

    .nav-menu {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .nav-link-custom {
      color: var(--navy);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 8px 12px;
      border-radius: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
      background: none;
      border: none;
    }
    .nav-link-custom:hover {
      background: var(--gold-light);
      color: var(--gold-dark);
    }
    .nav-link-custom.active {
      color: var(--gold);
      border-bottom: 2px solid var(--gold);
    }

    /* Menu mobile (offcanvas lateral) */
    .mobile-menu {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: var(--white);
      box-shadow: 2px 0 20px rgba(0,0,0,0.1);
      z-index: 1060;
      transition: left 0.3s ease;
      padding: 80px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .mobile-menu.open {
      left: 0;
    }
    .mobile-menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1055;
      display: none;
    }
    .mobile-menu-overlay.open {
      display: block;
    }
    .mobile-menu .nav-link-custom {
      display: block;
      padding: 12px 16px;
      font-size: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .mobile-menu .nav-link-custom:last-child {
      border-bottom: none;
    }
    .close-menu {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--navy);
    }

    /* ===== BOTÃO FLUTUANTE DO CARRINHO ===== */
    .cart-float {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--gold);
      border: none;
      color: var(--navy);
      font-size: 1.6rem;
      cursor: pointer;
      z-index: 1040;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-float:hover {
      transform: scale(1.08);
      background: var(--gold-dark);
      color: #fff;
      box-shadow: 0 6px 22px rgba(0,0,0,0.3);
    }

    .cart-badge-float {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--red);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      min-width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* ===== SEÇÃO PRINCIPAL ===== */
    .section { max-width: 1200px; margin: 0 auto; padding: 4rem 1.5rem; }
    .section-title { text-align: center; margin-bottom: 3rem; }
    .section-title h2 { font-size: 2rem; font-weight: 800; color: var(--navy); }
    .section-title p  { color: #64748b; margin-top: .5rem; font-size: 1rem; }
    .title-bar { width: 60px; height: 4px; background: var(--gold); margin: .8rem auto 0; border-radius: 2px; }

    /* ===== ESTILOS DA GALERIA ===== */
    .gallery-section {
      background: var(--white);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .gallery-filters {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .filter-btn {
      background: none;
      border: 2px solid var(--border);
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover,
    .filter-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #fff;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .gallery-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background: var(--bg);
    }
    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .gallery-img-wrap {
      width: 100%;
      height: 250px;
      overflow: hidden;
      background: linear-gradient(135deg, #e8f4fb, #d0eaf7);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gallery-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .gallery-item:hover .gallery-img-wrap img {
      transform: scale(1.05);
    }
    .gallery-info {
      padding: 1rem;
      background: var(--white);
    }
    .gallery-title {
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.3rem;
      font-size: 0.95rem;
    }
    .gallery-category {
      font-size: 0.75rem;
      color: var(--gold);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Modal da Galeria */
    .gallery-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1100;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
    .gallery-modal.active {
      display: flex;
    }
    .gallery-modal-content {
      max-width: 90%;
      max-height: 90%;
      position: relative;
    }
    .gallery-modal-content img {
      width: auto;
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      display: block;
      margin: auto;
    }
    .close-modal {
      position: absolute;
      top: -40px;
      right: 0;
      color: #fff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .close-modal:hover {
      color: var(--gold);
    }
    .modal-caption {
      text-align: center;
      color: #fff;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    /* Botão Voltar */
    .back-home-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 20px;
      color: var(--text);
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
      margin-bottom: 1.5rem;
      text-decoration: none;
    }
    .back-home-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* TOAST */
    .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 3000; display: flex; flex-direction: column; gap: .5rem; }
    .toast-msg {
      background: var(--navy); color: #fff; border-radius: 12px;
      padding: .85rem 1.2rem; font-size: .88rem;
      display: flex; align-items: center; gap: .5rem;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      animation: slideIn .3s ease; min-width: 220px;
    }
    .toast-msg.success { background: var(--green); }
    .toast-msg.error   { background: var(--red); }
    @keyframes slideIn { from{transform:translateX(120px);opacity:0} to{transform:translateX(0);opacity:1} }

    /* Footer */
    .site-footer {
      text-align: center; padding: 2rem 1rem;
      background: var(--navy); color: #64748b; font-size: .85rem; margin-top: 3rem;
    }
    .site-footer span { color: var(--gold); }
    .site-footer a {
      color: #64748b;
      text-decoration: none;
    }
    .site-footer a:hover {
      color: var(--gold);
    }

    /* ===== CARRINHO OFFCANVAS ===== */
    .offcanvas-header { border-bottom: 1px solid var(--border); }
    .offcanvas-title { font-weight: 800; color: var(--navy); font-size: 1.1rem; }

    .cart-item {
      display: flex; gap: .8rem; padding: .9rem 0;
      border-bottom: 1px solid var(--border); align-items: flex-start;
    }
    .cart-item-emoji { font-size: 2.2rem; line-height: 1; flex-shrink: 0; }
    .cart-item-info { flex: 1; }
    .cart-item-name  { font-weight: 700; font-size: .92rem; color: var(--navy); margin-bottom: .2rem; }
    .cart-item-unit  { font-size: .78rem; color: #94a3b8; }
    .cart-item-price { color: var(--gold); font-weight: 800; font-size: .95rem; margin-top: .3rem; }
    .cart-qty-row { display: flex; align-items: center; gap: .4rem; margin-top: .4rem; }
    .cart-qty-btn {
      width: 26px; height: 26px; border-radius: 7px;
      border: 1.5px solid var(--gold); background: none;
      color: var(--gold); font-weight: 700; cursor: pointer; font-size: .9rem;
      display: flex; align-items: center; justify-content: center; transition: .15s;
    }
    .cart-qty-btn:hover { background: var(--gold); color: #fff; }
    .cart-qty-val { font-weight: 700; min-width: 22px; text-align: center; font-size: .9rem; }
    .btn-remove { background: none; border: none; color: var(--red); cursor: pointer; font-size: .95rem; padding: 2px 6px; }
    .cart-empty { text-align: center; padding: 3rem 1rem; color: #94a3b8; }
    .cart-empty i { font-size: 3.5rem; margin-bottom: .8rem; display: block; }
    .cart-total-row { display: flex; justify-content: space-between; align-items: center; padding: .8rem 0; }
    .cart-total-label { font-weight: 700; color: var(--navy); font-size: 1.05rem; }
    .cart-total-val   { font-weight: 800; color: var(--gold); font-size: 1.2rem; }
    .btn-checkout-main {
      width: 100%; padding: 14px; background: var(--gold);
      border: none; border-radius: 12px; color: #fff;
      font-weight: 800; font-size: 1rem; cursor: pointer; transition: .2s;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    .btn-checkout-main:hover { background: var(--gold-dark); }

    @media(max-width: 768px) {
      .nav-menu {
        display: none;
      }
      .menu-toggle {
        display: block;
      }
      .gallery-filters { gap: 0.5rem; }
      .filter-btn { padding: 6px 14px; font-size: 0.8rem; }
      .cart-float {
        bottom: 70px;
        right: 15px;
        width: 50px;
        height: 50px;
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

<!-- ===== HEADER COM MENU HAMBURGUER ===== -->
<header class="top-header">
  <div class="nav-container">
    <a href="index.html" class="logo">
      <div class="logo-img">
        <img src="imagens/img_menu.png" alt="Logo Formas de Acrílico Premium">
      </div>
      <div>
        <div class="logo-text">S&B Laser</div>
        <div class="logo-sub">Arte em Acrílico</div>
      </div>
    </a>
    
    <!-- Menu Desktop -->
    <div class="nav-menu">
      <button class="nav-link-custom" onclick="window.location.href='index.html'">Início</button>
      <button class="nav-link-custom active" onclick="window.location.href='galeria.html'">Galeria</button>
      <button class="nav-link-custom" onclick="window.location.href='aboutus.html'">Sobre Nós</button>
    </div>

    <!-- Botão Menu Hamburguer (mobile) -->
    <button class="menu-toggle" onclick="toggleMobileMenu()">

<!-- Menu Mobile (Offcanvas lateral) -->
<div class="mobile-menu-overlay" id="mobileMenuOverlay" onclick="closeMobileMenu()"></div>
<div class="mobile-menu" id="mobileMenu">
  <button class="close-menu" onclick="closeMobileMenu()">
    <i class="bi bi-x-lg"></i>
  </button>

  <button class="nav-link-custom" onclick="window.location.href='index.html'">
    <i class="bi bi-house"></i> Início
  </button>
  <button class="nav-link-custom active" onclick="window.location.href='galeria.html'">
    <i class="bi bi-images"></i> Galeria
  </button>
  <button class="nav-link-custom" onclick="window.location.href='aboutus.html'">
    <i class="bi bi-building"></i> Sobre Nós
  </button>
</div>

<!-- ===== BOTÃO FLUTUANTE DO CARRINHO ===== -->
<button class="cart-float" onclick="openCart()">
  <i class="bi bi-cart3"></i>
  <span class="cart-badge-float" id="cartBadgeFloat">0</span>
</button>

<!-- ===== TOAST CONTAINER ===== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ===== OFFCANVAS: CARRINHO ===== -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" style="width:400px;max-width:100%;">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title"><i class="bi bi-cart3" style="color:var(--gold)"></i> Meu Carrinho</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column" style="padding:1.2rem;">
    <div id="cartItems" style="flex:1;overflow-y:auto;"></div>
    <div id="cartFooter" style="display:none;border-top:1px solid var(--border);padding-top:1rem;margin-top:.5rem;">
      <div class="cart-total-row">
        <span class="cart-total-label">Total do Carrinho:</span>
        <span class="cart-total-val" id="cartTotalVal">R$ 0,00</span>

      <button class="btn-checkout-main" onclick="goToCheckout()">
        <i class="bi bi-bag-check-fill"></i> Finalizar Compra
      </button>
      <button class="back-home-btn w-100 mt-2 d-flex justify-content-center" data-bs-dismiss="offcanvas">
        <i class="bi bi-arrow-left"></i> Continuar Comprando
      </button>

  </div>
</div>

<!-- ===== CONTEÚDO PRINCIPAL ===== -->
<main>
  <div class="section">
    <div class="section-title">
      <h2><i class="bi bi-images" style="color: var(--gold);"></i> Nossa Galeria</h2>
      <p>Conheça nosso trabalho e inspire-se com criações exclusivas em acrílico</p>
      <div class="title-bar"></div>
    </div>

    <div class="gallery-grid" id="galleryGrid">
      <!-- As imagens serão carregadas dinamicamente via JavaScript -->
    </div>

    <div style="text-align: center; margin-top: 2rem;">
      <a href="index.html" class="back-home-btn">
        <i class="bi bi-arrow-left"></i> Voltar para a Loja
      </a>
    </div>
  </div>
</main>

<!-- Modal para visualização da galeria -->
<div id="galleryModal" class="gallery-modal" onclick="closeGalleryModal()">
  <div class="gallery-modal-content" onclick="event.stopPropagation()">
    <span class="close-modal" onclick="closeGalleryModal()">&times;</span>
    <img id="modalImage" src="" alt="">
    <div id="modalCaption" class="modal-caption"></div>
  </div>
</div>

<footer class="site-footer">
  <p><span>✦ SB Acrilicos</span> &copy; 2025 — Qualidade que você pode tocar.</p>
  <p><span><a href="https://www.gr2sites.com.br" target="_blank">Site criado por GR2 sites e sistemas</a></span></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ============================================================
//  CARRINHO (SISTEMA COMPARTILHADO COM O INDEX)
// ============================================================
let cart = {};

// Carregar carrinho do localStorage ao iniciar
function loadCart() {
  const saved = localStorage.getItem('sbLaserCart');
  if (saved) {
    try {
      cart = JSON.parse(saved);
    } catch(e) { cart = {}; }
  }
  updateCart();
}

// Salvar carrinho no localStorage
function saveCart() {
  localStorage.setItem('sbLaserCart', JSON.stringify(cart));
}

function updateCart() {
  const ids = Object.keys(cart);
  const totalQty = ids.reduce((s, k) => s + cart[k].qty, 0);
  
  // Atualiza badge flutuante
  const badgeFloat = document.getElementById('cartBadgeFloat');
  if (badgeFloat) badgeFloat.textContent = totalQty;

  const cartItems = document.getElementById('cartItems');
  const cartFooter = document.getElementById('cartFooter');

  if (!cartItems) return;

  if (!ids.length) {
    cartItems.innerHTML = `<div class="cart-empty"><i class="bi bi-cart-x" style="color:#cbd5e1"></i><p>Carrinho vazio</p><small>Adicione produtos para continuar</small></div>`;
    if (cartFooter) cartFooter.style.display = 'none';
    saveCart();
    return;
  }

  if (cartFooter) cartFooter.style.display = 'block';
  cartItems.innerHTML = ids.map(k => {
    const item = cart[k];
    return `<div class="cart-item">
      <div class="cart-item-emoji">${item.emoji || '🟦'}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-unit">R$ ${fmt(item.price)} / un.</div>
        <div class="cart-item-price">R$ ${fmt(item.price * item.qty)}</div>
        <div class="cart-qty-row">
          <button class="cart-qty-btn" onclick="cartChangeQty('${k}',-1)">−</button>
          <span class="cart-qty-val">${item.qty}</span>
          <button class="cart-qty-btn" onclick="cartChangeQty('${k}',1)">+</button>
        </div>
      </div>
      <button class="btn-remove" onclick="removeFromCart('${k}')"><i class="bi bi-trash3"></i></button>
    </div>`;
  }).join('');

  const total = ids.reduce((s, k) => s + cart[k].price * cart[k].qty, 0);
  const totalEl = document.getElementById('cartTotalVal');
  if (totalEl) totalEl.textContent = 'R$ ' + fmt(total);
  
  saveCart();
}

function cartChangeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty = Math.max(1, cart[id].qty + delta);
  updateCart();
}

function removeFromCart(id) {
  delete cart[id];
  updateCart();
}

function openCart() {
  updateCart();
  new bootstrap.Offcanvas(document.getElementById('cartOffcanvas')).show();
}

function goToCheckout() {
  if (!Object.keys(cart).length) { toast('Carrinho vazio!', 'error'); return; }
  window.location.href = 'index.html';
}

function fmt(n) {
  return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function toast(msg, type = '') {
  const c = document.getElementById('toastContainer');
  if (!c) return;
  const el = document.createElement('div');
  el.className = 'toast-msg' + (type ? ' ' + type : '');
  const icon = type === 'success' ? 'check-circle-fill' : type === 'error' ? 'x-circle-fill' : 'info-circle-fill';
  el.innerHTML = `<i class="bi bi-${icon}"></i> ${msg}`;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); }, 2800);
}

// ============================================================
//  MENU MOBILE
// ============================================================
function toggleMobileMenu() {
  const menu = document.getElementById('mobileMenu');
  const overlay = document.getElementById('mobileMenuOverlay');
  menu.classList.toggle('open');
  overlay.classList.toggle('open');
  document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
}

function closeMobileMenu() {
  const menu = document.getElementById('mobileMenu');
  const overlay = document.getElementById('mobileMenuOverlay');
  menu.classList.remove('open');
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

// ============================================================
//  DADOS DA GALERIA
// ============================================================
const galleryItems = [
  // Formas (produtos)
  {
    id: 1,
    title: "Forma Acrílica 30x10x10",

// ============================================================
//  FUNÇÕES DA GALERIA
// ============================================================
let currentFilter = 'all';

function renderGallery() {
  const grid = document.getElementById('galleryGrid');
  if (!grid) return;
  
  const filteredItems = currentFilter === 'all' 
    ? galleryItems 
    : galleryItems.filter(item => item.category === currentFilter);
  
  if (filteredItems.length === 0) {
    grid.innerHTML = `
      <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
        <i class="bi bi-images" style="font-size: 3rem; color: var(--gold);"></i>
        <p style="margin-top: 1rem; color: #64748b;">Nenhuma imagem encontrada nesta categoria.</p>
      </div>
    `;
    return;
  }
  
  grid.innerHTML = filteredItems.map(item => `
    <div class="gallery-item" onclick="openGalleryModal('${item.image}', '${item.title}', '${item.description}')">
      <div class="gallery-img-wrap">
        <img src="${item.image}" alt="${item.title}" 
          onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\\'font-size:3rem;color:var(--gold);\\'><i class=\\'bi bi-image-fill\\'></i></div>'">
      </div>
      <div class="gallery-info">
        <div class="gallery-category">${getCategoryName(item.category)}</div>
        <div class="gallery-title">${item.title}</div>
      </div>
    </div>
  `).join('');
}

function getCategoryName(category) {
  const names = {
    'formas': '📦 Formas',
    'pecas': '✨ Peças Prontas',
    'detalhes': '🔍 Detalhes'
  };
  return names[category] || category;
}

function filterGallery(category) {
  currentFilter = category;
  
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
  
  renderGallery();
}

function openGalleryModal(imageSrc, title, description) {
  const modal = document.getElementById('galleryModal');
  const modalImage = document.getElementById('modalImage');
  const modalCaption = document.getElementById('modalCaption');
  
  modalImage.src = imageSrc;
  modalImage.alt = title;
  modalCaption.innerHTML = `<strong>${title}</strong><br>${description}`;
  
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeGalleryModal() {
  const modal = document.getElementById('galleryModal');
  modal.classList.remove('active');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    closeGalleryModal();
  }
});

// ============================================================
//  INICIALIZAÇÃO
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  loadCart();
  renderGallery();
  
  const urlParams = new URLSearchParams(window.location.search);
  const filter = urlParams.get('categoria');
  if (filter && ['formas', 'pecas', 'detalhes'].includes(filter)) {
    currentFilter = filter;
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => {
      if (btn.textContent.toLowerCase().includes(filter)) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
    renderGallery();
  }
});
</script>
