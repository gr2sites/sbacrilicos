<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria - Formas de Acrílico Premium</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --gold: #D4AF37;
      --gold-dark: #B8960F;
      --gold-light: #FFF8E7;
      --navy: #0f172a;
      --text: #334155;
      --bg: #f4f6fa;
      --white: #ffffff;
      --border: #e2e8f0;
      --whatsapp: #25D366;
      --whatsapp-dark: #128C7E;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: 20px;
    }

    /* ===== LOGO CENTRALIZADA ===== */
    .header-logo {
      text-align: center;
      padding: 1.5rem 0 1rem;
    }
    .logo-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border: 3px solid var(--gold);
    }
    .logo-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .logo-text {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--navy);
      margin-top: 0.5rem;
    }
    .logo-sub {
      font-size: 0.8rem;
      color: var(--gold);
      letter-spacing: 0.1em;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* ===== SEÇÃO PRINCIPAL ===== */
    .section { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .section-title { text-align: center; margin-bottom: 3rem; }
    .section-title h2 { font-size: 2rem; font-weight: 800; color: var(--navy); }
    .section-title p  { color: #64748b; margin-top: .5rem; font-size: 1rem; }
    .title-bar { width: 60px; height: 4px; background: var(--gold); margin: .8rem auto 0; border-radius: 2px; }

    /* ===== CARDS DE PRODUTOS ===== */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .gallery-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: var(--white);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
    }
    .gallery-img-wrap {
      width: 100%;
      height: 250px;
      overflow: hidden;
      background: linear-gradient(135deg, #e8f4fb, #d0eaf7);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }
    .gallery-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* ===== BADGE EXCLUSIVO ===== */
    .exclusive-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(212, 175, 55, 0.92);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    
    /* ===== INFORMAÇÕES DO PRODUTO ===== */
    .gallery-info {
      padding: 1rem 1.2rem 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .gallery-title {
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.3rem;
      font-size: 0.95rem;
    }
    .gallery-description {
      font-size: 0.85rem;
      color: #64748b;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Modal da Galeria */
    .gallery-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1100;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
    .gallery-modal.active {
      display: flex;
    }
    .gallery-modal-content {
      max-width: 90%;
      max-height: 90%;
      position: relative;
    }
    .gallery-modal-content img {
      width: auto;
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      display: block;
      margin: auto;
    }
    .close-modal {
      position: absolute;
      top: -40px;
      right: 0;
      color: #fff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .close-modal:hover {
      color: var(--gold);
    }
    .modal-caption {
      text-align: center;
      color: #fff;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    /* ===== BOTÃO WHATSAPP FLUTUANTE ===== */
    .whatsapp-float {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: var(--whatsapp);
      color: #fff;
      border: none;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      cursor: pointer;
      z-index: 1050;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      animation: pulse 2s infinite;
    }
    .whatsapp-float:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 30px rgba(37, 211, 102, 0.6);
      background: var(--whatsapp-dark);
    }
    .whatsapp-float i {
      font-size: 2.5rem;
    }
    
    /* ===== ANIMAÇÃO DE PULSO ===== */
    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4);
      }
      70% {
        box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
      }
    }

    /* ===== TOOLTIP DO WHATSAPP ===== */
    .whatsapp-tooltip {
      position: fixed;
      bottom: 105px;
      right: 30px;
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 1049;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    .whatsapp-tooltip.show {
      opacity: 1;
      transform: translateY(0);
    }
    .whatsapp-tooltip::after {
      content: '';
      position: absolute;
      bottom: -8px;
      right: 25px;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid rgba(15, 23, 42, 0.92);
    }

    /* Footer */
    .site-footer {
      text-align: center; padding: 2rem 1rem;
      background: var(--navy); color: #64748b; font-size: .85rem; margin-top: 3rem;
    }
    .site-footer span { color: var(--gold); }
    .site-footer a {
      color: #64748b;
      text-decoration: none;
    }
    .site-footer a:hover {
      color: var(--gold);
    }

    /* ===== RESPONSIVO ===== */
    @media(max-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 1rem;
      }
      .gallery-img-wrap {
        height: 200px;
      }
      .logo-img {
        width: 90px;
        height: 90px;
      }
      .whatsapp-float {
        width: 55px;
        height: 55px;
        bottom: 20px;
        right: 20px;
      }
      .whatsapp-float i {
        font-size: 2rem;
      }
      .whatsapp-tooltip {
        bottom: 90px;
        right: 20px;
        font-size: 0.75rem;
        padding: 8px 14px;
      }
    }

    @media(max-width: 480px) {
      .gallery-grid {
        grid-template-columns: 1fr;
        max-width: 400px;
        margin: 0 auto;
      }
      .section { padding: 1rem 1rem 3rem; }
      .whatsapp-float {
        width: 50px;
        height: 50px;
        bottom: 15px;
        right: 15px;
      }
      .whatsapp-float i {
        font-size: 1.8rem;
      }
      .whatsapp-tooltip {
        bottom: 80px;
        right: 15px;
        font-size: 0.7rem;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body>

<!-- ===== LOGO CENTRALIZADA ===== -->
<header class="header-logo">
  <div class="logo-img">
    <img src="imagens/img_menu.png" alt="Logo Formas de Acrílico Premium">
  </div>
  <div class="logo-text">SB Acrilicos</div>
  <div class="logo-sub">✦ Qualidade que você pode tocar ✦</div>
</header>

<!-- ===== CONTEÚDO PRINCIPAL ===== -->
<main>
  <div class="section">
    <div class="section-title">
      <h2><i class="bi bi-images" style="color: var(--gold);"></i> Nossa Galeria</h2>
      <p>Conheça nosso trabalho e inspire-se com criações exclusivas em acrílico</p>
      <div class="title-bar"></div>
    </div>

    <!-- ===== GRADE DE PRODUTOS ===== -->
    <div class="gallery-grid" id="galleryGrid">
      <!-- Carregado via JavaScript -->
    </div>
  </div>
</main>

<!-- ===== MODAL DA GALERIA ===== -->
<div id="galleryModal" class="gallery-modal" onclick="closeGalleryModal()">
  <div class="gallery-modal-content" onclick="event.stopPropagation()">
    <span class="close-modal" onclick="closeGalleryModal()">&times;</span>
    <img id="modalImage" src="" alt="">
    <div id="modalCaption" class="modal-caption"></div>
  </div>
</div>

<!-- ===== BOTÃO WHATSAPP FLUTUANTE ===== -->
<a href="https://wa.me/5516993987295?text=Olá!%20Vi%20sua%20galeria%20e%20gostaria%20de%20mais%20informações%20sobre%20os%20produtos%20em%20acrílico." 
   class="whatsapp-float" 
   target="_blank"
   onmouseenter="showTooltip()"
   onmouseleave="hideTooltip()"
   aria-label="Fale conosco no WhatsApp">
  <i class="bi bi-whatsapp"></i>
</a>

<!-- ===== TOOLTIP DO WHATSAPP ===== -->
<div class="whatsapp-tooltip" id="whatsappTooltip">
  <i class="bi bi-chat-dots" style="color: var(--whatsapp);"></i> Fale conosco!
</div>

<footer class="site-footer">
  <p><span>✦ SB Acrilicos</span> &copy; 2025 — Qualidade que você pode tocar.</p>
  <p><span><a href="https://www.gr2sites.com.br" target="_blank">Site criado por GR2 sites e sistemas</a></span></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ============================================================
//  DADOS DA GALERIA
// ============================================================
const galleryItems = [
  // Formas (produtos)
  {
    id: 1,
    title: "Forma Acrílica 30x10x10",
    image: "imagens/produto-01.jpeg",
    description: "Forma cristal de alta transparência para produções de menor volume"
  },
  {
    id: 2,
    title: "Forma Acrílica 30x20x10",
    image: "imagens/produto-02.jpeg",
    description: "Formato intermediário perfeito para produções variadas"
  },
  {
    id: 3,
    title: "Forma Acrílica 30x30x10",
    image: "imagens/produto-03.jpeg",
    description: "Formato grande para produções de alto volume"
  },
  // Peças Prontas
  {
    id: 4,
    title: "Fita de cetim personalizada",
    image: "imagens/galeria-01.jfif",
    description: "Peça exclusiva com acabamento premium e design moderno"
  },
  {
    id: 5,
    title: "Colher de madeira personalizada",
    image: "imagens/galeria-02.jfif",
    description: "Suporte elegante para eventos e confeitaria"
  },
  {
    id: 6,
    title: "Placa de sinalização",
    image: "imagens/galeria-03.jfif",
    description: "Organizador multifuncional com design sofisticado"
  },
  {
    id: 7,
    title: "Cake board",
    image: "imagens/galeria-04.jfif",
    description: "Letreiro personalizado para decoração de ambientes"
  },
  {
    id: 8,
    title: "Palito acrílico personalizado",
    image: "imagens/galeria-05.jfif",
    description: "Porta-retrato cristal com acabamento impecável"
  },
  // Detalhes e acabamentos
  {
    id: 9,
    title: "Topo de bolo espelhado dourado",
    image: "imagens/galeria-06.jfif",
    description: "Acabamento de alta transparência e brilho"
  },
  {
    id: 10,
    title: "Board formato personalizado",
    image: "imagens/galeria-07.jfif",
    description: "Corte a laser com precisão milimétrica"
  },
  {
    id: 11,
    title: "Cake Board especial",
    image: "imagens/galeria-08.jfif",
    description: "Polimento que garante acabamento perfeito"
  },
  {
    id: 12,
    title: "Fita de Cetim personalizada",
    image: "imagens/galeria-09.jfif",
    description: "Capacidade para produções em larga escala"
  }
];

// ============================================================
//  FUNÇÕES DA GALERIA
// ============================================================
function renderGallery() {
  const grid = document.getElementById('galleryGrid');
  if (!grid) return;
  
  grid.innerHTML = galleryItems.map(item => `
    <div class="gallery-item">
      <div class="gallery-img-wrap" onclick="openGalleryModal('${item.image}', '${item.title}', '${item.description}')">
        <span class="exclusive-badge">✦ EXCLUSIVO</span>
        <img src="${item.image}" alt="${item.title}" 
          onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\\'font-size:3rem;color:var(--gold);padding:2rem;\\'><i class=\\'bi bi-image-fill\\'></i></div>'">
      </div>
      <div class="gallery-info">
        <div class="gallery-title">${item.title}</div>
        <div class="gallery-description">${item.description}</div>
      </div>
    </div>
  `).join('');
}

function openGalleryModal(imageSrc, title, description) {
  const modal = document.getElementById('galleryModal');
  const modalImage = document.getElementById('modalImage');
  const modalCaption = document.getElementById('modalCaption');
  
  modalImage.src = imageSrc;
  modalImage.alt = title;
  modalCaption.innerHTML = `<strong>${title}</strong><br>${description}`;
  
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeGalleryModal() {
  const modal = document.getElementById('galleryModal');
  modal.classList.remove('active');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    closeGalleryModal();
  }
});

// ============================================================
//  FUNÇÕES DO TOOLTIP WHATSAPP
// ============================================================
function showTooltip() {
  document.getElementById('whatsappTooltip').classList.add('show');
}

function hideTooltip() {
  document.getElementById('whatsappTooltip').classList.remove('show');
}

// Mostrar tooltip automaticamente após 3 segundos
setTimeout(() => {
  showTooltip();
  setTimeout(() => hideTooltip(), 4000);
}, 3000);

// ============================================================
//  INICIALIZAÇÃO
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  renderGallery();
});
</script>
</body>
</html>
